name: CI

# Валідація на кожен пуш/PR у main: типи + i18n-гард.
# Білд .exe навмисно НЕ тут — портабл збирається й підписується локально
# (сертифікат живе в середовищі розробника, не в репо), потім публікується
# через `npm run release`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: i18n guard (parity + dups + key resolution)
        run: npm run i18n:check
